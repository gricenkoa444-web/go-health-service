cache: &global_cache
  key: global_cache
  paths:
    - hello-world_${VERSION}.tar.gz

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
  - build
  - release

build:
  stage: build
  cache: *global_cache
  image: golang:1.22.4-alpine3.20
  script:
    - go build -ldflags "-X main.buildVersion=${VERSION}" -o hello-world
    - tar -czvf hello-world_${VERSION}.tar.gz hello-world

release:
  stage: release
  cache: *global_cache
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - curl -u "${NEXUS_USER}:${NEXUS_PASSWORD}" --upload-file hello-world_${VERSION}.tar.gz "${NEXUS_URL}/repository/${NEXUS_REPO}/${VERSION}/hello-world_${VERSION}.tar.gz"  
