name: CI

on:
  push:
    branches: [main]

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Сборка
        run: go build -ldflags "-X main.buildVersion=${VERSION}" -o hello-world

      - name: Упаковка
        run: tar -czvf hello-world_${VERSION}.tar.gz hello-world

      - uses: actions/upload-artifact@v4
        with:
          name: hello-world
          path: hello-world_${{ env.VERSION }}.tar.gz

  release:
    needs: build
    runs-on: self-hosted      # нужен для локального Nexus, см. ниже
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-world

      - name: Загрузка в Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_REPO: ${{ vars.NEXUS_REPO }}
        run: >
          curl --fail -u "${NEXUS_USER}:${NEXUS_PASSWORD}"
          --upload-file hello-world_${VERSION}.tar.gz
          "${NEXUS_URL}/repository/${NEXUS_REPO}/${VERSION}/hello-world_${VERSION}.tar.gz"
  deploy:
    needs: release
    runs-on: self-hosted
    environment:
      name: production
    env:
      NEXUS_URL: ${{ vars.NEXUS_URL }}
      NEXUS_REPO: ${{ vars.NEXUS_REPO }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      VM_USER: ${{ vars.VM_USER }}
      VM_IP: ${{ vars.VM_IP }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Подготовка SSH-ключа
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY_B64}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Копирование файлов на ВМ
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ./hello-world.service ${VM_USER}@${VM_IP}:/home/${VM_USER}/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ./deploy.sh ${VM_USER}@${VM_IP}:/home/${VM_USER}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${VM_USER}@${VM_IP} "chmod +x /home/${VM_USER}/deploy.sh"

      - name: Запуск деплоя
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${VM_USER}@${VM_IP} \
            "export VERSION=${VERSION} NEXUS_USER=${NEXUS_USER} NEXUS_PASSWORD=${NEXUS_PASSWORD} NEXUS_URL=${NEXUS_URL} NEXUS_REPO=${NEXUS_REPO}; /home/${VM_USER}/deploy.sh"

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
