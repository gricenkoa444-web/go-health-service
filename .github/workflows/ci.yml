name: CI 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка GO
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Статический анализ
        run: go vet ./...
      
      - name: Тесты
        run: go test -race ./...      
